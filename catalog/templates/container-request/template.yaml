apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: container-request
  title: Deploy a Container
  description: Run a container image on managed Kubernetes (AWS or Azure, amd64 or arm64), with an optional public HTTPS URL.
  # Launch → Compute → Containers selects a platform before opening this form.
  tags: [product]
  annotations:
    cf/product: Containers
    cf/launch-flow: platform
spec:
  owner: group:default/platform-admins
  presentation:
    buttonLabels:
      createButtonText: Deploy
  type: service
  parameters:
    - title: Container
      required: [name, team, container, tags]
      properties:
        name:
          title: Name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,20}$'
          description: Unique lowercase name, 3–21 characters. Also the URL, https://<name>.apps.idp.amirasyraf.dev.
        team:
          title: Owning Team
          type: string
          ui:field: MyGroupsPicker
        container:
          title: Container
          type: object
          additionalProperties: false
          required: [platform, arch, image, port, size, replicas, public]
          properties:
            platform:
              title: Platform
              type: string
              enum: [aws, azure]
              ui:field: ContainerPlatform
            image:
              title: Image
              type: string
              description: A public image, e.g. nginx:alpine or ghcr.io/org/app:1.2. It must support the architecture below.
              pattern: '^[A-Za-z0-9][A-Za-z0-9._/:@-]{0,254}$'
            port:
              title: Container Port
              type: integer
              default: 80
              minimum: 1
              maximum: 65535
            arch:
              title: Architecture
              type: string
              default: amd64
              enum: [amd64, arm64]
              enumNames: ['x86-64 (amd64)', 'Arm (arm64)']
              description: Multi-arch images run on either. A worker node starts on demand (about 1–3 minutes) when none is running.
            size:
              title: Size
              type: string
              default: XS
              enum: [XS, S, M]
              enumNames: ['XS — 0.1 vCPU, 128 MiB', 'S — 0.25 vCPU, 256 MiB', 'M — 0.5 vCPU, 512 MiB']
            replicas:
              title: Replicas
              type: integer
              default: 1
              enum: [1, 2]
            public:
              title: Public HTTPS URL
              type: boolean
              default: true
            env:
              title: Environment Variables
              description: Stored in the public platform repo. Do not enter secrets.
              type: object
              default: {}
              maxProperties: 20
              propertyNames:
                pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'
              additionalProperties:
                type: string
                maxLength: 1024
        tags:
          title: Tags
          description: cost_center and project_code are required and self-reported (not billing authorization). Do not enter secrets.
          type: object
          additionalProperties: false
          required: [costCenter, projectCode]
          ui:field: VmTagsEditor
          properties:
            costCenter:
              title: cost_center
              type: string
              minLength: 1
              maxLength: 256
            projectCode:
              title: project_code
              type: string
              minLength: 1
              maxLength: 256
            extra:
              title: Additional Tags
              type: object
              default: {}
              maxProperties: 40
              additionalProperties:
                type: string
                maxLength: 256
  steps:
    - id: dispatch
      name: Start deployment run
      action: cf:container:dispatch
      input:
        name: ${{ parameters.name }}
        specJson: >-
          {"type":"container","owner":${{ parameters.team | dump }},"lifecycle":"poc",
          "container":${{ parameters.container | dump }},
          "billing":{"costCenter":${{ parameters.tags.costCenter | dump }},"projectCode":${{ parameters.tags.projectCode | dump }}},
          "cloudTags":${{ parameters.tags.extra | default({}) | dump }}}
  output:
    links:
      - title: Follow Deployment
        url: ${{ steps.dispatch.output.runUrl }}
